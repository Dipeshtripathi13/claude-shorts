<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { width: 100%; height: 100%; border: 0; display: block; }
  p {
    color: #bbb; font: 13px/1.5 system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<div id="player"></div>
<script>
/*
 * A playback shim, and nothing else.
 *
 * Two problems are solved here, both caused by where the extension lives.
 *
 * 1. YouTube requires an HTTP Referer to identify who is embedding a player,
 *    and Chrome sends none from a chrome-extension:// page, so embedding there
 *    fails with "Video player configuration error (153)". Framing this page
 *    instead gives YouTube a real https origin.
 *
 * 2. Nothing autoplays. The extension loads this page alongside the result, so
 *    the viewer's one click is YouTube's own play button. Autoplaying here
 *    would start a video nobody asked for.
 *
 * Deliberately trivial otherwise: no tracking, no analytics, and no logic that
 * belongs in the extension.
 */
(function () {
  var id = new URLSearchParams(location.search).get('v') || '';

  // Only ever interpolate something that looks like a YouTube id.
  if (!/^[A-Za-z0-9_-]{6,24}$/.test(id)) {
    document.body.textContent = '';
    var p = document.createElement('p');
    p.textContent = 'No valid video id given.';
    document.body.appendChild(p);
    return;
  }

  var f = document.createElement('iframe');
  // No autoplay: this page is now loaded together with the result, so starting
  // playback here would mean a video began without the viewer asking. YouTube's
  // own play button is the single, deliberate click.
  f.src = 'https://www.youtube-nocookie.com/embed/' + id +
          '?rel=0&modestbranding=1&playsinline=1';
  f.title = 'YouTube video player';
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; web-share');
  f.setAttribute('allowfullscreen', '');
  var host = document.getElementById('player');
  host.parentNode.replaceChild(f, host);

  // Tell the panel this page is alive. An iframe pointing at a moved or broken
  // URL still fires `load` for the error page, so silence is the only reliable
  // signal that the player is not there — and the panel falls back to opening
  // clips in a window.
  try { window.parent.postMessage({ tangent: 'player-ready' }, '*'); } catch (e) { /* not framed */ }
})();
</script>
</body>
</html>
